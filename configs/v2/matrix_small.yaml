# make reproduce-small (plan Week 21, task 4): reduced versions of every figure in under an hour
# on a laptop. Same structure as matrix.yaml; smaller scale, fewer seeds and budgets. Results go to
# results/small/ and are never mixed with the frozen matrix's.
version: 1
scale:
  n_hosts: 300
  horizon_days: 120
  warmup_days: 30
  risk_h_days: 30
budgets_pct: [1, 2]
seeds:
  dev: [101, 102]
  eval: [1, 3]
  replication: [1001, 1003]
tuning: {dev_seeds: [101, 102], steps: 6}
predictor: oracle
regimes:
  A: [A1, A3, A5, A7]
  E: [E1, E3]
  B: [B1, B2]
  C: [C]
  D: [D]
policies: [P0, P1, P2, P3, P4, P5, P6, P7, P8]
predictor_by_regime:
  D: drift
p6:
  look_every: 7
  alpha: 0.05
  n_boot: 200
  slope_band: [0.8, 1.25]
  min_events: 30
  audit_window: 90
  passes_needed: 2
confirmatory:
  policies: [P4, P5, P6]
  regimes: [A3, A5, B1, B2, C]
  budgets_pct: [1, 2]
